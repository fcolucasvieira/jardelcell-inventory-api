spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET}
  expiration-hours: 2

logging:
  level:
    root: INFO
    br.com.jardelcell.inventory: DEBUG

app:
  bootstrap:
    admin:
      full-name: ${ADMIN_FULL_NAME}
      email: ${ADMIN_EMAIL}
      password: ${ADMIN_PASSWORD}


